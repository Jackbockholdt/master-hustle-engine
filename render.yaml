# render.yaml
# Render Blueprint Specification for One-Click Template Deployment
# Learn more at https://render.com/docs/blueprints

services:
  - type: web
    name: master-hustle-engine
    env: node
    # Starter (not free): the free tier spins down after ~15 min idle, which kills
    # the in-process setInterval schedulers (lead batch, follow-ups, Gumloop trigger)
    # long before their 6h timers elapse. Free also cannot mount a persistent disk.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    # Persistent disk for SQLite. pickDataDir() (server.js:58) probes /data first,
    # so this mountPath is what moves the DB off the ephemeral container filesystem.
    # Without it, send history, the lead queue, pending follow-ups, and the runtime
    # do-not-contact table are wiped on every restart and redeploy — and a wiped
    # DNC table means re-mailing people who already opted out.
    disk:
      name: master-hustle-engine-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Render injects its own PORT; this pins the value the service binds to.
      # Local dev defaults to 3005 (see .env.example and config/env.js).
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Your Google Gemini API Key"

      # SMTP Email Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
        placeholder: "sender@gmail.com"
      - key: SMTP_PASS
        sync: false
        placeholder: "Gmail App Password"

      # Admin Notification Email
      - key: ADMIN_EMAIL
        sync: false
        placeholder: "admin@domain.com"

      # Admin route gate. Fail-closed: unset → /admin and /api/admin return 503.
      # Set this in the Render dashboard BEFORE the commit that adds the gate.
      - key: ADMIN_KEY
        sync: false
        generateValue: true

      # Bottom Promo Link
      - key: PS_LINK
        value: https://jacksplugreviews.com

      # Stripe Payment Integration
      - key: STRIPE_SECRET_KEY
        sync: false
        placeholder: "sk_live_..."
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
        placeholder: "whsec_..."

      # OpenPhone — SMS text-back for missed calls
      - key: OPENPHONE_API_KEY
        sync: false
        placeholder: "Your OpenPhone API Key"
      - key: OPENPHONE_FROM_NUMBER
        sync: false
        placeholder: "+1XXXXXXXXXX"

      # B2B Sales Engine — Invention Outreach
      - key: INVENTOR_NAME
        sync: false
        placeholder: "Your Name"
      - key: INVENTOR_EMAIL
        sync: false
        placeholder: "your@email.com"
      - key: INVENTION_NAME
        value: "White-Label Agency AI Infrastructure"
      - key: INVENTION_SUMMARY
        sync: false
        placeholder: "One-paragraph description of what you are licensing"
      - key: PROOF_URL
        sync: false
        placeholder: "https://yourdemosite.com"
      # Pricing lives in config/pricing.json — the single authority read by both
      # server.js and orchestrator.py. Do not declare a pricing env var here.
      - key: STRIPE_PAYMENT_LINK
        sync: false
        placeholder: "https://buy.stripe.com/..."
      - key: TARGET_INDUSTRIES
        value: "digital marketing agency,lead generation agency,marketing agency,seo agency,ppc agency,social media agency,growth agency,advertising agency"
      - key: BATCH_INTERVAL_HOURS
        value: "6"
      - key: BATCH_SIZE
        value: "4"

      # Cold-outbound kill switch. Default (and the value pinned here) is PAUSED:
      # no cold pitches, no follow-ups, no Gumloop lead pulls. Everything else —
      # lead intake, Stripe, admin alerts, the status digest — keeps running.
      # Set to "false" in the Render dashboard when you intend to send again.
      - key: OUTBOUND_PAUSED
        value: "true"
      - key: OUTBOUND_PAUSE_REASON
        sync: false
        placeholder: "Why sending is paused (shown in /health and the digest)"
