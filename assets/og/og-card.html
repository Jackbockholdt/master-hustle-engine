<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>OG card source</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #fff; position: relative; }
  .glow { position: absolute; right: -160px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(249, 115, 22, .45), rgba(249, 115, 22, 0) 70%); }
  .inner { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
  .brand svg { width: 58px; height: 58px; }
  h1 { font-size: 70px; line-height: 1.04; letter-spacing: -.03em; margin: 54px 0 0; font-weight: 800; max-width: 1060px; }
  h1 em { font-style: normal; color: #fb923c; }
  p { font-size: 30px; color: #cbd5e1; margin: 26px 0 0; font-weight: 600; }
  .steps { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .steps span { font-size: 23px; font-weight: 700; padding: 10px 16px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); color: #e2e8f0; }
  .steps span.last { background: #ea580c; border-color: #ea580c; color: #fff; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#fff"/><path d="M14 46V18h7l11 14 11-14h7v28h-7V30l-11 13-11-13v16z" fill="#0f172a"/><circle cx="50" cy="14" r="6" fill="#f97316"/></svg>
      Master Hustle Engine
    </div>
    <h1>Your agency's AI sales desk.<br><em>Under your brand.</em></h1>
    <p>Resell it to your clients. Set your price. Keep the margin.</p>
    <div class="steps">
      <span>Finds leads</span><span>Writes outreach</span><span>Follows up</span><span>Handles replies</span><span class="last">Books the job</span>
    </div>
  </div>
</body>
</html>
